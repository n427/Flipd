<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Flipd mark: the wordmark's F + cardinal dot, no plate.
       The F flips to white in dark mode so it stays legible on a dark tab
       strip; the dot is always cardinal (#990000) — the one brand accent. -->
  <style>
    .f { fill: #111111; }
    @media (prefers-color-scheme: dark) {
      .f { fill: #ffffff; }
    }
  </style>
  <path class="f" d="M4.5 4 H19.5 V9.5 H10 V13.5 H17.5 V18.75 H10 V28 H4.5 Z" />
  <circle cx="24.5" cy="25" r="3" fill="#990000" />
</svg>
